<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale / user-scalable are deliberately NOT set: mobile zoom stays available. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Paint before JS: an empty #root is otherwise a white page while Vite
         resolves modules (painful when Desktop/iCloud is still hydrating files). -->
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #000; color: #e7e1d6; }
    </style>

    <title>Quartier Barcelona | More Than A Club</title>
    <meta
      name="description"
      content="Quartier Barcelona. A nightlife destination in Pedralbes, Barcelona. More Than A Club."
    />

    <link rel="canonical" href="https://quartierbarcelona.com/" />

    <!-- Favicon / app icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/favicon-512.png?v=2" />
    <link rel="apple-touch-icon" href="/brand/favicon-180.png?v=2" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quartier Barcelona" />
    <meta property="og:title" content="Quartier Barcelona | More Than A Club" />
    <meta
      property="og:description"
      content="Quartier Barcelona. A nightlife destination in Pedralbes, Barcelona. More Than A Club."
    />
    <meta property="og:url" content="https://quartierbarcelona.com/" />
    <meta property="og:image" content="https://quartierbarcelona.com/img/brand-moment-1600.jpg" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="de_DE" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quartier Barcelona | More Than A Club" />
    <meta
      name="twitter:description"
      content="Quartier Barcelona. A nightlife destination in Pedralbes, Barcelona. More Than A Club."
    />
    <meta name="twitter:image" content="https://quartierbarcelona.com/img/brand-moment-1600.jpg" />

    <!-- Self-hosted type: no third-party font requests. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-500-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-700-latin.woff2" crossorigin />
    <link rel="preload" as="image" href="/video/hero-poster.jpg" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
