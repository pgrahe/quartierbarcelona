<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale / user-scalable are deliberately NOT set: mobile zoom stays available. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Paint before JS: an empty #root is otherwise a white page while Vite
         resolves modules (painful when Desktop/iCloud is still hydrating files). -->
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #000; color: #e7e1d6; }
    </style>

    <!-- Title, description, canonical, hreflang, Open Graph, Twitter and
         JSON-LD are written per page and per language by
         scripts/prerender.mjs. During `vite dev` this placeholder is simply
         left as-is, and the runtime head sync (src/seo/useDocumentHead.js)
         keeps the tab title and social tags correct as you navigate. -->
    <!--seo-head-->
    <title>Quartier Barcelona | Club en Pedralbes</title>

    <!-- Favicon / app icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/favicon-512.png?v=2" />
    <link rel="apple-touch-icon" href="/brand/favicon-180.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Self-hosted type: no third-party font requests. Deliberately NOT
         preloaded. The @font-face rules now live in the bundled, render-
         blocking stylesheet, so the browser discovers them almost as early as
         a preload would — while a preload would compete for bandwidth with the
         hero poster, which is the actual LCP element. font-display: swap means
         text is never invisible in the meantime. -->

    <!-- LCP preload. Which image that is depends on the page — the hero's
         poster frame on the home page, the header photograph on the three
         content pages — so the build writes it in, from the same config the
         components render from (src/config/pageHeroes.js). `vite dev` leaves
         the placeholder alone; it costs a page one preload hint, nothing more. -->
    <!--lcp-preload-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
