<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Tickets</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0a;
        overflow: hidden;
      }
      #fourvenues-iframe {
        width: 100%;
      }
      #fourvenues-iframe iframe {
        display: block;
        width: 100%;
        border: 0;
        background: #0a0a0a;
      }
      /* Covers the blank frame while the widget boots or is being restored. */
      #tickets-spinner {
        position: absolute;
        top: 22vh;
        left: 50%;
        width: 34px;
        height: 34px;
        margin-left: -17px;
        border: 2px solid rgba(235, 225, 210, 0.22);
        border-top-color: rgba(235, 225, 210, 0.85);
        border-radius: 50%;
        animation: tickets-spin 0.9s linear infinite;
        pointer-events: none;
        z-index: 2;
      }
      #tickets-spinner[hidden] {
        display: none;
      }
      @keyframes tickets-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #tickets-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="tickets-spinner" role="presentation"></div>
    <div id="fourvenues-iframe"></div>
    <script>
      (function () {
        var RESTORE = 'quartier-tickets-restore'
        /* Nothing real renders this short — the widget's empty shell is ~40px. */
        var COLLAPSED_PX = 220
        /* Opening an event flashes a short height for ~150ms before it fills. */
        var SETTLE_MS = 500
        var BOOT_TIMEOUT_MS = 15000

        var spinner = document.getElementById('tickets-spinner')
        var sawTall = false
        var collapseTimer = null

        function payload(data) {
          if (!data) return null
          if (typeof data === 'string') {
            try {
              return JSON.parse(data)
            } catch (err) {
              return null
            }
          }
          return typeof data === 'object' ? data : null
        }

        function tellParent(message) {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(message, '*')
          }
        }

        function hideSpinner() {
          if (spinner) spinner.hidden = true
        }

        function flag(value) {
          try {
            if (value === null) sessionStorage.removeItem(RESTORE)
            else sessionStorage.setItem(RESTORE, value)
          } catch (err) {}
        }

        function flagged() {
          try {
            return sessionStorage.getItem(RESTORE) === '1'
          } catch (err) {
            return false
          }
        }

        function pixels(value) {
          var n = parseInt(String(value || ''), 10)
          return isNaN(n) ? 0 : n
        }

        /* Their widget glues its own query string into the hash
           (`calendar@2026-11?theme=dark/some-event`). Everything from the `?`
           on is unusable as a route, so keep the leading segment only. */
        function route(hash) {
          var value = ''
          try {
            value = decodeURIComponent(String(hash || '').replace(/^#/, ''))
          } catch (err) {
            value = String(hash || '').replace(/^#/, '')
          }
          if (value.indexOf('?') >= 0) value = value.split('?')[0]
          return /^(calendar|events|passes)/.test(value) ? value : ''
        }

        /* Their script writes ?theme=dark onto this page. The widget then
           glues that query into the hash on the way back to the calendar
           and paints a blank grey frame. Keep theme off this document. */
        var replaceState = history.replaceState
        history.replaceState = function (state, title, url) {
          if (typeof url === 'string') {
            try {
              var next = new URL(url, location.href)
              if (next.searchParams.has('theme')) {
                next.searchParams.delete('theme')
                url = next.pathname + next.search + next.hash
              }
            } catch (err) {}
          }
          return replaceState.call(history, state, title, url)
        }

        /* Fourvenues' own back arrow is broken: it tears the event down and
           renders an empty ~40px shell, with no navigate message and no hash
           change to react to. The collapsed height is the only signal we get,
           so reload this frame — and only this frame, /tickets itself stays
           put — onto the calendar month the event belonged to. */
        function restoreCalendar() {
          collapseTimer = null
          if (flagged()) return
          flag('1')
          var back = route(location.hash)
          if (back.indexOf('calendar') !== 0) back = ''
          replaceState.call(history, null, '', location.pathname + (back ? '#' + back : ''))
          location.reload()
        }

        function onHeight(height) {
          var px = pixels(height)

          if (px > COLLAPSED_PX) {
            sawTall = true
            hideSpinner()
            flag(null)
            if (collapseTimer) {
              clearTimeout(collapseTimer)
              collapseTimer = null
            }
            tellParent({ key: 'quartier-tickets-height', height: height })
            return
          }

          /* Still booting: pass it through, nothing to restore yet. */
          if (!sawTall) {
            tellParent({ key: 'quartier-tickets-height', height: height })
            return
          }

          /* Collapsed after a real render. Hold the current height so the page
             does not jump, and restore unless it fills back in. */
          if (!collapseTimer) collapseTimer = setTimeout(restoreCalendar, SETTLE_MS)
        }

        window.addEventListener('message', function (event) {
          var data = payload(event.data)
          if (!data) return
          if (data.key === 'addHeight' && data.height) onHeight(data.height)
          if (data.key === 'forwardScroll') {
            tellParent({ key: 'quartier-tickets-scroll', deltaY: data.deltaY || 0 })
          }
        })

        /* A corrupt hash left over from an earlier visit would boot the widget
           into the same blank frame. Clean it before their script reads it. */
        var booted = route(location.hash)
        if (booted !== String(location.hash || '').replace(/^#/, '')) {
          replaceState.call(history, null, '', location.pathname + (booted ? '#' + booted : ''))
        }

        setTimeout(hideSpinner, BOOT_TIMEOUT_MS)
      })()
    </script>
    <script src="https://www.fourvenues.com/assets/iframe/quartier-club/calendar@?theme=dark" async></script>
  </body>
</html>
