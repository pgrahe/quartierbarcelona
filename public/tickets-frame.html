<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Tickets</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0a;
        overflow: hidden;
      }
      #fourvenues-iframe {
        width: 100%;
      }
      #fourvenues-iframe iframe {
        display: block;
        width: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="fourvenues-iframe"></div>
    <script>
      (function () {
        function payload(data) {
          if (!data) return null
          if (typeof data === 'string') {
            try {
              return JSON.parse(data)
            } catch (err) {
              return null
            }
          }
          return typeof data === 'object' ? data : null
        }

        function tellParent(message) {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(message, '*')
          }
        }

        window.addEventListener('message', function (event) {
          var data = payload(event.data)
          if (!data) return
          if (data.key === 'addHeight' && data.height) {
            tellParent({ key: 'quartier-tickets-height', height: data.height })
          }
          if (data.key === 'forwardScroll') {
            tellParent({ key: 'quartier-tickets-scroll', deltaY: data.deltaY || 0 })
          }
        })
      })()
    </script>
    <script src="https://www.fourvenues.com/assets/iframe/quartier-club/calendar@?theme=dark" async></script>
  </body>
</html>
